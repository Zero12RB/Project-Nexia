[package]
name = "nexia-launcher"
version = "0.1.0"
edition = "2021"
description = "Minecraft Java launcher viết bằng Rust: đăng nhập Microsoft, Modrinth, đổi skin"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
